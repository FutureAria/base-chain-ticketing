name: 💬 질문
description: 코드나 구조가 이해되지 않을 때
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        먼저 여기를 보시면 답이 있을 수 있습니다.
        [개발 환경](https://github.com/FutureAria/base-chain-ticketing/blob/main/docs/DEVELOPMENT.md) ·
        [아키텍처](https://github.com/FutureAria/base-chain-ticketing/blob/main/docs/ARCHITECTURE.md) ·
        [API](https://github.com/FutureAria/base-chain-ticketing/blob/main/docs/API.md) ·
        [DB](https://github.com/FutureAria/base-chain-ticketing/blob/main/docs/DATABASE.md)

  - type: textarea
    id: question
    attributes:
      label: 무엇이 궁금하신가요
      placeholder: 좌석 확보를 왜 트랜잭션과 유니크 제약으로 이중으로 막나요?
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: 관련 파일·줄 (아신다면)
      placeholder: server/services/ticketService.js:120

  - type: textarea
    id: tried
    attributes:
      label: 무엇을 해보셨나요
      description: 읽어본 문서나 시도한 것이 있으면 적어 주세요. 없으면 비워 두셔도 됩니다.
